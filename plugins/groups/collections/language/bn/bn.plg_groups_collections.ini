PLG_GROUPS_COLLECTIONS_SETTINGS_CREATE_COLLECTIONS_INFO="<strong>ডিফল্ট সেটিংস:</strong> গ্রুপ ম্যানেজাররা যে কোনও সংগ্রহ যোগ/সম্পাদনা/মুছে ফেলতে পারবে। সাধারণ গ্রুপ সদস্যরা সংগ্রহ তৈরি করতে পারবে না।"

; Instructions
PLG_GROUPS_COLLECTIONS_NO_COLLECTIONS_FOUND="কোনো সংগ্রহ পাওয়া যায়নি।"
PLG_GROUPS_COLLECTIONS_INSTRUCT_COLLECTION_STEP1="&quot;নতুন সংগ্রহ&quot; বোতামে ক্লিক করুন।"
PLG_GROUPS_COLLECTIONS_INSTRUCT_COLLECTION_STEP2="একটি শিরোনাম এবং হয়তো একটি বর্ণনা যোগ করুন।"
PLG_GROUPS_COLLECTIONS_INSTRUCT_COLLECTION_STEP3="বিষয়বস্তুর যোগ করা শুরু করুন!"
PLG_GROUPS_COLLECTIONS_INSTRUCT_COLLECTION_ABOUT_TITLE="সংগ্রহ কি?"
PLG_GROUPS_COLLECTIONS_INSTRUCT_COLLECTION_ABOUT_DESC="সংগ্রহ হল যেখানে আপনি পোস্টগুলোকে বিষয়ভিত্তিকভাবে সংগঠিত করেন। উদাহরণস্বরূপ, আপনি আপনার ফিজিক্স ১০১ সংগ্রহের জন্য ডায়াগ্রাম, ফাইল, রিসোর্স বা উইকি পৃষ্ঠা সংগ্রহ করতে পারেন। সংগ্রহগুলি প্রাইভেট বা পাবলিক হতে পারে।"
PLG_GROUPS_COLLECTIONS_INSTRUCT_POST_STEP1="যে চিত্র, ফাইল, লিঙ্ক বা টেক্সট আপনি শেয়ার করতে চান তা খুঁজুন।"
PLG_GROUPS_COLLECTIONS_INSTRUCT_POST_STEP2="&quot;নতুন পোস্ট&quot; বোতামে ক্লিক করুন।"
PLG_GROUPS_COLLECTIONS_INSTRUCT_POST_STEP3="যে কোনও অতিরিক্ত কিছু যোগ করুন (ট্যাগগুলি ভালো)।"
PLG_GROUPS_COLLECTIONS_INSTRUCT_POST_STEP4="সম্পন্ন!"
PLG_GROUPS_COLLECTIONS_INSTRUCT_POST_TITLE="পোস্ট কি?"
PLG_GROUPS_COLLECTIONS_INSTRUCT_POST_DESC="একটি পোস্ট একটি চিত্র, লিঙ্ক বা ফাইল দিয়ে শুরু হয় যা আপনি একটি সংগ্রহে যোগ করেন। যেকোনো পোস্ট সংগ্রহ করা যেতে পারে (অন্য একটি সংগ্রহে পুনরায় পোস্ট করা)।"
