; Feed
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED="这个页面是什么？"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED_EXPLANATION="这是一个实时信息流，展示您所关注的成员和收藏中的帖子。由于您看到此提示，说明您目前尚未关注任何成员或任何收藏。"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING="明白了。那么，什么是“关注”？"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING_EXPLANATION="“关注”某个人，意味着您将在此页面实时看到该成员发布的帖子。如果他/她创建了新的收藏，您也会自动关注该新收藏。</p><p>如果您只对特定收藏中新发布的内容感兴趣，也可以单独关注某个收藏。</p><p>您可以随时取消关注其他成员或收藏。"
PLG_MEMBERS_COLLECTIONS_WHERE_ARE_MY_POSTS="明白了。但<em>我的</em>帖子在哪里？"
PLG_MEMBERS_COLLECTIONS_WHERE_ARE_MY_POSTS_EXPLANATION="您的帖子可以在“帖子”标签页下查看（显示您的全部帖子），或者点击某个收藏的标题（仅查看该收藏中的帖子）。"
