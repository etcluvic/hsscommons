; Feed
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED="Що це за сторінка?"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED_EXPLANATION="Це жива стрічка записів від користувачів та колекцій, за якими ви стежите. Якщо ви бачите це повідомлення — це означає, що ви наразі не стежите ні за ким і ні за якими колекціями."
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING="Гаразд. То що таке &quot;стеження&quot;?"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING_EXPLANATION=""&quot;Стежити&quot; за кимось означає бачити його/її записи на цій сторінці в режимі реального часу. Якщо він/вона створить нову колекцію — ви автоматично почнете стежити і за нею.</p><p>Ви також можете стежити за окремими колекціями, якщо вас цікавлять лише записи в певних колекціях.</p><p>Ви можете припинити стеження за будь-якою особою чи колекцією в будь-який момент."
PLG_MEMBERS_COLLECTIONS_WHERE_ARE_MY_POSTS="Зрозуміло. Але де <em>мої</em> записи?"
PLG_MEMBERS_COLLECTIONS_WHERE_ARE_MY_POSTS_EXPLANATION="Ваші записи знаходяться у вкладці &quot;Записи&quot; (для перегляду всіх записів) або при натисканні на заголовок однієї з ваших колекцій (щоб побачити лише записи з цієї колекції)."
PLG_MEMBERS_COLLECTIONS_FEED_INSTRUCTIONS_STEP1="Знайдіть учасника або <a href=\"_QQ_%s_QQ_\">колекцію</a>, яка вам подобається."
PLG_MEMBERS_COLLECTIONS_FEED_INSTRUCTIONS_STEP2="Натисніть кнопку &quot;стежити&quot;."
PLG_MEMBERS_COLLECTIONS_FEED_INSTRUCTIONS_STEP3="Поверніться сюди та переглядайте всі записи!"
PLG_MEMBERS_COLLECTIONS_FEED_NO_POSTS_AVAILABLE_FOR_YOU="Немає записів від учасників або колекцій, за якими ви стежите."
