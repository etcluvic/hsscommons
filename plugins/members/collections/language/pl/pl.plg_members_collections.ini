; Feed
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED="Do czego służy ta strona?"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED_EXPLANATION="Tablica wpisów dodawanych przez obserwowanych użytkowników i w obserwowanych kolekcjach, uaktualniana na bieżąco. Ten komunikat jest wyświetlany, jeżeli lista obserwowanych jest pusta."
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING="Na czym polega &quot;obserwowanie&quot;?"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING_EXPLANATION="&quot;Obserwowanie&quot; użytkownika oznacza, że wpisy danej osoby będą na bieżąco pojawiać się na tablicy. Jeżeli obserwowany użytkownik utworzy nową kolekcję, zostanie ona automatycznie dodana do obserwowanych. </p><p>Można obserwować wybrane kolekcje w celu bieżącego śledzenia dodawanych tam wpisów.</p><p>Użytkowników i kolekcje można w każdej chwili usunąć z listy obserwowanych."
PLG_MEMBERS_COLLECTIONS_WHERE_ARE_MY_POSTS="Gdzie mogę przejrzeć <em>własne</em> wpisy?"
PLG_MEMBERS_COLLECTIONS_WHERE_ARE_MY_POSTS_EXPLANATION="Wpisy użytkownika można przeglądać w zakładce &quot;Wpisy&quot; tab (tam widać wszystkie) lub po kliknięciu jednej z kolekcji użytkownika (tylko wpisy należące do kolekcji)."
PLG_MEMBERS_COLLECTIONS_FEED_INSTRUCTIONS_STEP1="Wyszukać użytkownika lub <a href="_QQ_"%s"_QQ_">kolekcję</a>."
PLG_MEMBERS_COLLECTIONS_FEED_INSTRUCTIONS_STEP2="Kliknąć przycisk &quot;obserwuj&quot; button."
PLG_MEMBERS_COLLECTIONS_FEED_INSTRUCTIONS_STEP3="Wrócić na tablicę - pojawią się tam wpisy obserwowanych"
PLG_MEMBERS_COLLECTIONS_FEED_NO_POSTS_AVAILABLE_FOR_YOU="Brak wpisów dodanych przez obserwowanych użytkowników/w kolekcjach."
PLG_MEMBERS_COLLECTIONS_FEED_NO_POSTS_AVAILABLE_FOR_THIS_MEMBER="Brak wpisów dodanych przez użytkowników lub w kolekcjach obserwowanych przez bieżącego użytkownika."
