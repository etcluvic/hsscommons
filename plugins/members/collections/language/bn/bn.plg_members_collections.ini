PLG_MEMBERS_COLLECTIONS_WHAT_IS_COLLECTION_EXPLANATION="একটি সংগ্রহ হল যেখানে আপনি পোস্টগুলোকে বিষয় অনুযায়ী সংগঠিত করেন। উদাহরণস্বরূপ, আপনি ফিজিক্স ১০১ সংগ্রহের জন্য ফিজিক্স সম্পর্কিত ডায়াগ্রাম, ফাইল, রিসোর্স, বা উইকি পৃষ্ঠা সংগ্রহ করতে পারেন। সংগ্রহগুলো ব্যক্তিগত বা পাবলিক হতে পারে।"

