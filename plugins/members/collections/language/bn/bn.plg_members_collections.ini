; Feed
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED="এটি কী পেজ?"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED_EXPLANATION="এটি হল সেই সমস্ত সদস্য এবং সংগ্রহের পোস্টগুলির লাইভ ফিড যেগুলি আপনি অনুসরণ করছেন। আপনি এই বার্তা দেখছেন, এর মানে হল আপনি বর্তমানে কাউকে বা কোনও সংগ্রহ অনুসরণ করছেন না।"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING="ঠিক আছে, তাহলে &quot;অনুসরণ&quot; কি?"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING_EXPLANATION="&quot;অনুসরণ&quot; মানে হল আপনি সেই ব্যক্তির পোস্টগুলি এই পেজে রিয়েল টাইমে দেখতে পারবেন। যদি তিনি একটি নতুন সংগ্রহ তৈরি করেন, আপনি স্বয়ংক্রিয়ভাবে নতুন সংগ্রহটিও অনুসরণ করবেন।</p><p>আপনি যদি শুধুমাত্র নির্দিষ্ট সংগ্রহে যোগ করা পোস্টগুলি দেখতে চান তবে আপনি একক সংগ্রহও অনুসরণ করতে পারেন।</p><p>আপনি যেকোনো সময় অন্যদের বা সংগ্রহগুলোকে অনুসরণ বন্ধ করতে পারেন।"
