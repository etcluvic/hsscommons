; Feed
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED="O que é esta página?"
PLG_MEMBERS_COLLECTIONS_WHAT_IS_FEED_EXPLANATION="Este é um feed ao vivo de postagens dos membros e coleções que você está seguindo. Como você está vendo esta mensagem, significa que você não está seguindo ninguém ou nenhuma coleção no momento."
