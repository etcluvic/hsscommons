PLG_MEMBERS_COLLECTIONS_WHAT_IS_FOLLOWING_EXPLANATION="&quot;Seguir&quot; alguém significa que você verá as postagens dessa pessoa nesta página em tempo real. Se ele/ela criar uma nova coleção, você automaticamente seguirá a nova coleção também.</p><p>Você pode seguir coleções individuais se estiver interessado apenas em ver as postagens sendo adicionadas a coleções específicas.</p><p>Você pode deixar de seguir outras pessoas ou coleções a qualquer momento."
