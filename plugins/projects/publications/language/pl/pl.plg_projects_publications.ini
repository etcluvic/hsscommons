PLG_PROJECTS_PUBLICATIONS_CONTENT_NO_DOI_EXPLANATION="<p>Proszę wprowadzić więej informacji o publikacji na tej i nastęnych stronach w celu ponownej publikacji w repozytorium Canadian HSS Commons. Na stronie “Notatki” można dodać pierwotną bibliografię do publikacji.</p>
<p>Materiałom opublikowanym wcześniej można dodać identyfikator DOI w późniejszym terminie. Na ostatniej stronie recenzji, należy wybrać opcję &apos;Publikuj z identyfikatorem DOI&apos;.</p>"
PLG_PROJECTS_PUBLICATIONS_CONTENT_HAVE_DOI_EXPLANATION="<p>Jeżeli publikacja ma już przypisany identyfikator DOI, proszę wprowadzić go poniżej - informacje o publikacji zostaną pobrane automatycznie.</p>
