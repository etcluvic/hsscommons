PLG_PROJECTS_PUBLICATIONS_CONTENT_NO_DOI_EXPLANATION="<p>আপনার প্রকাশনার বিষয়ে আরও তথ্য এখানে এবং পরবর্তী পৃষ্ঠাগুলিতে লিখুন যাতে এটি কানাডিয়ান এইচএসএস কমন্স রেপোজিটরিতে পুনঃপ্রকাশ করা যায়। "নোট" পৃষ্ঠায়, আপনি প্রকাশনা&apos;র মূল উক্তি তথ্য প্রদান করতে পারেন।</p>
<p>আপনি কি আপনার পূর্বে প্রকাশিত আইটেমকে DOI দিতে চান? এটিও সম্ভব! চূড়ান্ত পর্যালোচনা পৃষ্ঠায়, কেবল &apos;DOI সহ প্রকাশ করুন&apos; নির্বাচন করুন।</p>"
PLG_PROJECTS_PUBLICATIONS_CONTENT_HAVE_DOI_EXPLANATION="<p>আপনার প্রকাশনার যদি ইতিমধ্যেই একটি ডিজিটাল অবজেক্ট আইডেন্টিফায়ার (DOI) থাকে, দয়া করে এটি নিচে প্রবেশ করুন যাতে আপনার প্রকাশনার তথ্য স্বয়ংক্রিয়ভাবে পুনরুদ্ধার করা যায়।</p>
<p>নোট: নিচের &quot;Retrieve&quot; বোতামটিতে ক্লিক করার পর, বোতামটি নিষ্ক্রিয় হয়ে যাবে। যদি আপনি ভুল করে DOI প্রবেশ করেন বা আবার শুরু করতে চান, তাহলে এই পৃষ্ঠার উপরের ডানদিকে &quot;খসড়া বাতিল করুন&quot; লিঙ্কে ক্লিক করুন।</p>
<strong>নিম্নলিখিত বিন্যাসে প্রকাশনার DOI প্রবেশ করুন: 10.12345/ABDC-1001</strong>"
PLG_PROJECTS_PUBLICATIONS_RETRIEVE="পুনরুদ্ধার করুন"
