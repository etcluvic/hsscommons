; Intro
PLG_PROJECTS_PUBLICATIONS_PUB_HOW_IT_WORKS="প্রকাশনা প্রক্রিয়াটি কীভাবে কাজ করে..."  
PLG_PROJECTS_PUBLICATIONS_PUB_INTRO_STEP_ONE="আপনার বিষয়বস্তু নির্বাচন ও সাজান"  
PLG_PROJECTS_PUBLICATIONS_PUB_INTRO_STEP_TWO="প্রকাশনার বর্ণনা দিন এবং পর্যালোচনার জন্য জমা দিন"  
PLG_PROJECTS_PUBLICATIONS_PUB_INTRO_STEP_THREE="প্রকাশ এবং সংরক্ষণ করুন বা পর্যালোচনার জন্য সংরক্ষণ করুন"  
PLG_PROJECTS_PUBLICATIONS_PUB_INTRO_STEP_ONE_ABOUT="আপনার প্রকল্প ফাইলগুলি থেকে বিষয়বস্তু নির্বাচন করুন। এটি একটি একক ফাইল বা একাধিক ফাইল একত্রিত হতে পারে। আপনি সহায়ক নথি যেমন একটি ব্যবহারকারী গাইডও যোগ করতে পারেন।"  
PLG_PROJECTS_PUBLICATIONS_PUB_INTRO_STEP_ONE_ABOUT_OUTSIDE="আপনি যে ডেটা প্রকাশ করতে চান তা সংগ্রহ করুন। এটি একটি একক ফাইল বা একাধিক ফাইল একত্রিত হতে পারে। আপনি সহায়ক নথি যেমন একটি ব্যবহারকারী গাইডও যোগ করতে পারেন।"  
PLG_PROJECTS_PUBLICATIONS_PUB_INTRO_STEP_TWO_ABOUT="পরবর্তীতে আপনি আপনার প্রকাশনার পৃষ্ঠা তৈরি করবেন, যেখানে শিরোনাম, সারসংক্ষেপ, বর্ণনা, লেখক এবং অন্যান্য মেটাডেটা যোগ করবেন। আপনি ট্যাগ এবং স্ক্রিনশটও যোগ করতে পারেন।"  
PLG_PROJECTS_PUBLICATIONS_PUB_INTRO_STEP_THREE_ABOUT="যখন খসড়াটি প্রস্তুত হবে, আপনি আপনার কাজটি প্রকাশ্যে প্রকাশ করতে এবং সংরক্ষণ করতে পারবেন বা অভ্যন্তরীণ পর্যালোচনার জন্য খসড়াটি সংরক্ষণ করতে পারবেন। জনসাধারণের জন্য প্রকাশনার সাথে একটি ডিজিটাল অবজেক্ট আইডেন্টিফায়ার থাকবে এবং এটি প্রশাসকের অনুমোদনের প্রয়োজন হবে।"  

