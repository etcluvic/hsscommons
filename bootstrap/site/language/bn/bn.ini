JFIELD_ALIAS_DESC="অ্যালিয়াসটি SEF URL-এ ব্যবহৃত হবে। যদি এটি খালি রাখা হয়, তাহলে সিস্টেম শিরোনাম থেকে একটি ডিফল্ট মান পূরণ করবে। এই মানটি SEO সেটিংসের উপর নির্ভর করবে (গ্লোবাল কনফিগারেশন->সাইট)। <br />ইউনিকোড ব্যবহার করলে UTF-8 অ্যালিয়াস তৈরি হবে। আপনি চাইলে ম্যানুয়ালি যেকোনো UTF-8 অক্ষর লিখতে পারেন। স্পেস এবং কিছু নিষিদ্ধ অক্ষর হাইফেনে পরিবর্তিত হবে।<br />ডিফল্ট ট্রান্সলিটারেশন ব্যবহার করলে এটি ছোট হাতের অক্ষর এবং হাইফেন (-) দিয়ে অ্যালিয়াস তৈরি করবে। আপনি চাইলে নিজে অ্যালিয়াস লিখতে পারেন। কেবল ছোট হাতের অক্ষর এবং হাইফেন (-) ব্যবহার করুন। স্পেস বা আন্ডারস্কোর অনুমোদিত নয়। যদি শিরোনাম নন-ল্যাটিন অক্ষরে টাইপ করা হয়, তাহলে ডিফল্ট মান হবে তারিখ এবং সময়।"
