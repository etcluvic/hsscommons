JLIB_RULES_SELECT_SETTING="Sélectionner un nouveau paramètre <sup>1</sup>"
JLIB_RULES_SETTING_NOTES="1. Si vous modifiez ce paramètre, il s’appliquera à ce groupe et à tous les groupes enfants, composants et contenus. Notez que <em>Refusé</em> prévaut sur tout paramètre hérité, ainsi que sur ceux des groupes enfants, composants ou contenus. En cas de conflit, <em>Refusé</em> aura la priorité. <em>Non défini</em> équivaut à <em>Refusé</em> mais peut être modifié dans les groupes enfants, composants ou contenus.<br />2. Si vous sélectionnez un nouveau paramètre, cliquez sur <em>Enregistrer</em> pour recalculer les paramètres."
JLIB_RULES_SETTING_NOTES_ITEM="1. Si vous modifiez ce paramètre, il s’appliquera à cet élément. Notez que :<br /><em>Hérité</em> signifie que les autorisations de la configuration globale, du groupe parent et de la catégorie seront utilisées.<br /><em>Refusé</em> signifie que, quelle que soit la configuration globale, les paramètres du groupe parent ou de la catégorie, le groupe modifié ne pourra pas effectuer cette action sur cet élément.<br /><em>Autorisé</em> signifie que le groupe pourra effectuer cette action (mais en cas de conflit avec la configuration globale, le groupe parent ou la catégorie, cela n’aura aucun effet ; un conflit sera indiqué par <em>Non autorisé (Verrouillé)</em> dans les paramètres calculés).<br />2. Si vous sélectionnez un nouveau paramètre, cliquez sur <em>Enregistrer</em> pour recalculer les paramètres."
JLIB_RULES_SETTINGS_DESC="Gérez les paramètres d’autorisation pour les groupes d’utilisateurs ci-dessous. Voir les notes en bas."

