JFIELD_ALIAS_DESC="L’alias sera utilisé dans l’URL SEF. Laissez ce champ vide pour que le système utilise automatiquement un alias basé sur le titre. Ce comportement dépendra des paramètres SEO (Configuration globale → Site).<br />L'utilisation de caractères Unicode produira des alias UTF-8. Vous pouvez également saisir manuellement n’importe quel caractère UTF-8. Les espaces et caractères non autorisés seront remplacés par des tirets.<br />Avec la translittération par défaut, l’alias sera en minuscules avec des tirets à la place des espaces. Utilisez des lettres minuscules et des tirets (-). Les espaces et underscores ne sont pas autorisés. Si le titre contient des lettres non latines, la valeur par défaut sera la date et l’heure."
