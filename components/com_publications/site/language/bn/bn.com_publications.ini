; Intro pages
COM_PUBLICATIONS_INTRO_HEADING="রিপোজিটরি কী?"
COM_PUBLICATIONS_INTRO_TEXT="রিপোজিটরি একটি ওপেন অ্যাকসেস, লাভজনক নয় এমন স্পেস যেখানে আপনি প্রকাশনা, শিক্ষা উপকরণ, তথ্য এবং অন্যান্য বৈজ্ঞানিক সামগ্রী বিনামূল্যে শেয়ার, অ্যাক্সেস, পুনঃব্যবহার এবং উন্নয়ন করতে পারেন। আপনি এছাড়াও নির্ধারণ করতে পারেন যে রিপোজিটরি আইটেমগুলি পাবলিক বা প্রাইভেট হবে কিনা, একটি <a href='https://hsscommons.ca/kb/resources/what-is-doi'>DOI</a> বরাদ্দ করতে, আপনার প্রকাশনাগুলির জন্য ব্যবহারের পরিসংখ্যান দেখতে এবং আরও অনেক কিছু!"
