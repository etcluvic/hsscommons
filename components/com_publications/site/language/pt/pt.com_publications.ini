; Intro pages
COM_PUBLICATIONS_INTRO_HEADING="O que é o Repositório?"
COM_PUBLICATIONS_INTRO_TEXT="O repositório é um espaço de acesso aberto e sem fins lucrativos onde você pode compartilhar, acessar, reutilizar e desenvolver publicações, recursos educacionais, dados e outros materiais acadêmicos de forma livre. Você também pode escolher se deseja tornar os itens do repositório públicos ou privados, atribuir-lhes um <a href='https://hsscommons.ca/kb/resources/what-is-doi'>DOI</a>, visualizar as estatísticas de uso das suas publicações e muito mais!"