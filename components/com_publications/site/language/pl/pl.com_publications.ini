COM_PUBLICATIONS_INTRO_HEADING="O Repozytorium"
COM_PUBLICATIONS_INTRO_TEXT="Repozytorium to usługa w wolnym dostępie, która pozwala udostępniać, modyfikować i rozwijać publikacje, zasoby edukacyjne, dane i inne materiały związane z pracą naukową. Materiały w repozytorium mogą być publiczne lub prywatne, można przypisywać im identyfikatory  <a href='https://hsscommons.ca/kb/resources/what-is-doi'>DOI</a>, przeglądać statystyki użytkowania, oraz korzystać z innych opcji dostępnych w serwisie.”
