COM_PROJECTS_HOWTO_GROUP_EXPLAIN="Група, яка створює проєкт, формує початкову команду проєкту. Якщо ви належите до цієї групи або приєднаєтеся до неї, ви отримаєте доступ до проєкту. Якщо ви вийдете з групи, то втратите доступ до проєкту, якщо тільки вас не додадуть до нього окремо. Ролі в проєкті (менеджер/співучасник) спочатку успадковуються від ролей у групі (менеджер/учасник), але можуть змінюватися індивідуально в будь-який момент. Як творець проєкту, ви автоматично отримуєте роль менеджера, яку не можна змінити до завершення налаштування проєкту."
