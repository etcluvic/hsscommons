COM_PROJECTS_FEATURES_SEE_SUGGESTIONS="Переглянути всі пропозиції"
COM_PROJECTS_FEATURES_TODO_ABOUT="У проєктах є зручний інструмент списків завдань, який допоможе вам відстежувати щоденний порядок денний проєкту. Учасники проєкту можуть додавати та редагувати завдання, призначати їх одне одному, вказувати дату завершення, додавати коментарі та відмічати виконання. Також є можливість створювати кілька (до 10) списків завдань."
COM_PROJECTS_FEATURES_NOTES="Нотатки проєкту"
COM_PROJECTS_FEATURES_NOTES_ABOUT="Нотатки проєкту — це вікі-простір для вашого проєкту, де ви можете записувати розгорнуті коментарі, ескізи ідей, деталізувати план розробки або просто використовувати цей простір для спільної роботи. Ви можете додавати кілька сторінок і підсторінок, створювати шаблони, вбудовувати зображення та файли, а також користуватися іншими популярними функціями вікі."
COM_PROJECTS_FEATURES_NOTES_PLANNED_ONE="Можливість прикріплювати обрані нотатки до публікацій проєкту як допоміжний матеріал вікі або основний контент"
COM_PROJECTS_FEATURES_TEAM="Команда проєкту"
COM_PROJECTS_FEATURES_TEAM_ABOUT="Проєкт може бути створений окремим користувачем або групою. У будь-якому випадку менеджери проєкту можуть розширити свою команду, додаючи інших користувачів і групи, до яких вони належать. Вони також можуть запрошувати зовнішніх співпрацівників через електронну пошту. Інтерфейс керування командою дозволяє призначати ролі менеджера, співпрацівника або лише для читання."
COM_PROJECTS_FEATURES_FILES="Управління файлами"
COM_PROJECTS_FEATURES_FILES_ABOUT_START="У проєктах доступні різноманітні варіанти обміну файлами. Наприклад, ви можете ділитися файлами з командою через популярні сервіси, такі як GitHub, Google Drive і Dropbox. Кожен проєкт також має власне"
COM_PROJECTS_FEATURES_FILES_ABOUT_GIT="Git"
COM_PROJECTS_FEATURES_FILES_ABOUT_END="сховище для зберігання файлів і даних. У ньому є вбудований веб-браузер файлів, який зчитує сховище та дозволяє завантажувати кілька файлів одночасно, видаляти, перейменовувати й переміщати файли, компілювати LaTeX-файли у PDF, переглядати історію файлів, порівнювати версії та завантажувати попередні версії."
COM_PROJECTS_FEATURES_FILES_PLANNED_ONE="Покращений попередній перегляд файлів, включаючи DOC і PDF"
COM_PROJECTS_FEATURES_FILES_PLANNED_TWO="Порівняння версій документів поруч"
COM_PROJECTS_FEATURES_FILES_PLANNED_THREE="Додаткові опції керування файлами"
COM_PROJECTS_FEATURES_APPS="Розробка застосунків"
COM_PROJECTS_FEATURES_APPS_ABOUT_START="Проєкти, орієнтовані на розробку застосунків, мають спеціальний розділ для реєстрації, керування, тестування та публікації ваших застосунків. Кожен зареєстрований застосунок отримує власне"
COM_PROJECTS_FEATURES_APPS_ABOUT_GIT="Git"
COM_PROJECTS_FEATURES_APPS_ABOUT_END="сховище з кодом, який можна переглядати через браузер файлів проєкту."
COM_PROJECTS_FEATURES_APPS_PLANNED_ONE="Покращений попередній перегляд файлів, включаючи DOC і PDF"
COM_PROJECTS_FEATURES_APPS_PLANNED_TWO="Порівняння версій документів поруч"
COM_PROJECTS_FEATURES_APPS_PLANNED_THREE="Більш функціональний веб-браузер файлів"
COM_PROJECTS_FEATURES_PUBLICATIONS="Публікація"
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT_WIP="У проєктах інтегровано механізм публікації, щоб ви могли представити матеріали свого проєкту світові у вигляді веб-публікацій. Кожна опублікована версія отримує цифровий ідентифікатор об’єкта (DOI), що дозволяє іншим цитувати вашу роботу. Користувачі можуть залишати відгуки, створювати тікети підтримки та додавати ідеї до списку побажань на сторінці кожної публікації. У майбутньому ви зможете публікувати не лише окремі файли чи застосунки, а й колекції ресурсів, вікі-матеріали та посилання на зовнішні сайти."
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT="У проєктах інтегровано механізм публікації, щоб ви могли представити матеріали свого проєкту світові у вигляді веб-публікацій. Кожна опублікована версія отримає цифровий ідентифікатор об’єкта (DOI), що дозволяє іншим цитувати вашу роботу. Користувачі зможуть залишати відгуки, створювати тікети підтримки та додавати ідеї до списку побажань на сторінці публікації. Згодом можна буде публікувати не лише вибрані файли проєкту, а й застосунки, інтерактивні бази даних, колекції ресурсів, вікі-матеріали та зовнішні посилання."
COM_PROJECTS_FEATURES_IN_THE_WORKS="*у розробці"
COM_PROJECTS_FEATURES_ACTIVITY="Статистика активності"
COM_PROJECTS_FEATURES_ACTIVITY_ABOUT="Проєкти відстежують різні дії, виконані їх учасниками. За допомогою інструменту статистики активності ви зможете дізнатися, наприклад, хто з команди залишив найбільше коментарів або виконав найбільше завдань. Для менеджерів проєктів доступна детальніша статистика. Статистику цікаво спостерігати, але її також можна використовувати для оцінювання, наприклад, у студентських проєктах під керівництвом викладача."
COM_PROJECTS_FEATURES_MORE="Інші доповнення"
COM_PROJECTS_FEATURES_MORE_ABOUT="Ми шукаємо способи інтеграції популярних публічних застосунків для співпраці у проєкти. Підключення до GDrive для файлів проєкту вже доступне для всіх або вибраних проєктів. Також розглядається інтеграція з Dropbox та FlyLatex для синхронізації файлів і роботи з .tex-файлами. Поділіться своїми ідеями з нами! Рекомендуйте інші інструменти та функції, які зроблять проєкти ціннішими для вашої спільноти."

