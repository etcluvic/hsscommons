COM_PROJECTS_HOWTO_BUILD_TEAM_GROUP="У груповому проєкті всі початкові учасники групи включаються до команди з самого початку. Поки вони залишаються в складі групи, вони зберігатимуть певний рівень доступу до цього проєкту, навіть якщо формально вийдуть із нього."
