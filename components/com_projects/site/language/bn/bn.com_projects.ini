COM_PROJECTS_ERROR_SETUP_TERMS_SPECIFY_DATA="অনুগ্রহ করে নির্দিষ্ট করুন কোন সংবেদনশীল ডেটা আপনি আপনার প্রকল্পে ব্যবহার করবেন"
COM_PROJECTS_ERROR_SETUP_TERMS_NOTE="টিপ: আপনার প্রকল্পের তথ্য সংরক্ষণ করা হয়েছে। আপনি এখন আপনার ব্রাউজারটি বন্ধ করতে পারেন, উপযুক্ত বিশ্ববিদ্যালয় সম্মতি কর্মচারীদের সাথে পরামর্শ করতে পারেন, এবং এই প্রক্রিয়াটি পুনরায় শুরু করতে পারেন কোনও তথ্য হারানো ছাড়াই।"
COM_PROJECTS_SETUP_TERMS_HIPAA_YES="হ্যাঁ, এই প্রকল্পে ব্যক্তিগতভাবে চিহ্নিত স্বাস্থ্য বা ছাত্র তথ্য থাকতে পারে। আমি HIPAA/FERPA প্রয়োজনীয়তা বুঝি এবং আমি নিশ্চিত করি যে আমি এই প্রয়োজনীয়তা অনুসরণ করার জন্য দায়ী"
COM_PROJECTS_SETUP_TERMS_HIPAA_NO="না, এই প্রকল্পে কোন ব্যক্তিগতভাবে চিহ্নিত স্বাস্থ্য বা ছাত্র তথ্য থাকবে না।"
COM_PROJECTS_SETUP_TERMS_PRIVACY_WHY="আমরা এটি কেন উল্লেখ করছি?"
COM_PROJECTS_SETUP_TERMS_PRIVACY_BECAUSE="কারণ আমরা অনলাইন কনটেন্টের গোপনীয়তা রক্ষা করার এবং সংবেদনশীল ব্যক্তিগত ডেটার ব্যবহার সম্পর্কিত বিধিমালা মেনে চলার বাধ্যবাধকতাকে স্বীকার করি। আমরা আপনাকে সহযোগিতা এবং ডেটা শেয়ার করার জন্য সরঞ্জামগুলি প্রদান করি, আপনি যে ডেটা আপলোড করবেন তার জন্য আপনি দায়বদ্ধ। পড়ুন আমাদের"
