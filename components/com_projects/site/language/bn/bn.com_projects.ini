COM_PROJECTS_SETUP_TERMS_RESTRICTED_EXPLAIN="<p>সংবেদনশীল ডেটা ব্যক্তিগত, আর্থিক এবং আইনি তথ্য অন্তর্ভুক্ত করতে পারে, পাশাপাশি রাজ্য বা ফেডারেল আইন এবং বিশ্ববিদ্যালয়ের নীতি দ্বারা সুরক্ষিত তথ্য। <span class="_QQ_"prominent dark"_QQ_">এই সাইটটি সরকারীভাবে সুরক্ষিত, রপ্তানি-নিয়ন্ত্রিত, বা প্রোপ্রাইটারি কোম্পানি ডেটা (অনুমতি ছাড়া) সংরক্ষণ করতে ব্যবহৃত হতে পারে না, এবং এটি HIPAA সুরক্ষিত স্বাস্থ্য তথ্য (PHI) সংরক্ষণ করতে ব্যবহৃত হতে পারে না।</span> FERPA বিধিমালা দ্বারা সুরক্ষিত ডেটা অন্তর্ভুক্ত করা প্রকল্পগুলিকে এগিয়ে যাওয়ার আগে যথাযথ বিশ্ববিদ্যালয় কর্মচারীদের দ্বারা পর্যালোচনা করা আবশ্যক। ডেটা যা ইনস্টিটিউশনাল রিভিউ বোর্ড (IRB) অনুমোদন প্রয়োজন, তা এই সাইটে শুধুমাত্র তখনই সংরক্ষণ করা যেতে পারে যদি সমস্ত প্রয়োজনীয় অনুমোদন পাওয়া যায়।</p><p class="_QQ_"prominent"_QQ_">যদি আপনি এগিয়ে যেতে চান, তবে নীচের চালিয়ে যাওয়া বাটনে ক্লিক করুন।</p>"

