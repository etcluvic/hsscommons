COM_PROJECTS_SETUP_TERMS_RESTRICTED_STOP_FERPA_AGREE="হ্যাঁ, আমি পড়েছি, বুঝেছি এবং গ্রহণ করেছি যে আমার প্রকল্প পর্যালোচনা না হওয়া পর্যন্ত এটি স্থগিত থাকবে।"
COM_PROJECTS_SETUP_TERMS_RESTRICTED_STOP_FERPA="FERPA বিধিমালা দ্বারা সুরক্ষিত তথ্য অন্তর্ভুক্ত করতে পারে এমন প্রকল্পগুলি যথাযথ বিশ্ববিদ্যালয় কর্মচারী দ্বারা পর্যালোচনা করা আবশ্যক। আপনার প্রকল্পটি পর্যালোচনা হওয়া পর্যন্ত এটি সাময়িকভাবে স্থগিত থাকবে। আপনাকে ২-৩ কার্যদিবসের মধ্যে ইমেল দ্বারা যোগাযোগ করা হবে, এবং FERPA সম্মতি পর্যালোচনা এবং অনুমোদনের পরে আপনি আপনার প্রকল্প চালিয়ে যেতে পারবেন।"
