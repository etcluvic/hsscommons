COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT_WIP="প্রকল্পগুলি একটি প্রকাশনা ইঞ্জিনের মাধ্যমে আপনার প্রকল্পের উপকরণ বিশ্বজুড়ে ওয়েব প্রকাশনার মাধ্যমে পৌঁছে দেয়। প্রতিটি প্রকাশিত প্রকাশনা একটি ডিজিটাল অবজেক্ট আইডেন্টিফায়ার (DOI) পায়, যাতে অন্যরা আপনার কাজ সাইট করতে পারে। সাধারণ জনগণ প্রতিটি প্রকাশনায় রিভিউ দিতে পারে, সাপোর্ট টিকেট জমা দিতে পারে এবং ইচ্ছের তালিকায় নতুন ধারণা যোগ করতে পারে। ভবিষ্যতে প্রকল্পগুলি আপনাকে শুধু নির্বাচিত প্রকল্প ফাইল বা অ্যাপ নয়, বরং রিসোর্স কালেকশন, উইকি উপকরণ এবং বাইরের ওয়েবসাইটের লিঙ্কও প্রকাশ করতে সাহায্য করবে।"
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT="প্রকল্পগুলি একটি প্রকাশনা ইঞ্জিনের মাধ্যমে আপনার প্রকল্পের উপকরণ বিশ্বজুড়ে ওয়েব প্রকাশনার মাধ্যমে পৌঁছে দেয়। প্রতিটি প্রকাশিত সংস্করণ একটি ডিজিটাল অবজেক্ট আইডেন্টিফায়ার (DOI) পায়, যাতে অন্যরা আপনার কাজ সাইট করতে পারে। সাধারণ জনগণ প্রতিটি প্রকাশনায় রিভিউ দিতে পারে, সাপোর্ট টিকেট জমা দিতে পারে এবং ইচ্ছের তালিকায় নতুন ধারণা যোগ করতে পারে। ভবিষ্যতে প্রকল্পগুলি আপনাকে শুধু নির্বাচিত প্রকল্প ফাইল নয়, প্রকল্প অ্যাপ, ইন্টারঅ্যাকটিভ ডেটাবেস, রিসোর্স কালেকশন, উইকি উপকরণ এবং বাইরের ওয়েবসাইটের লিঙ্কও প্রকাশ করতে সাহায্য করবে।"
COM_PROJECTS_FEATURES_IN_THE_WORKS="*কাজ চলছে"
COM_PROJECTS_FEATURES_ACTIVITY="কার্যকলাপ পরিসংখ্যান"
COM_PROJECTS_FEATURES_ACTIVITY_ABOUT="প্রকল্পগুলি তাদের সদস্যদের দ্বারা সম্পাদিত বিভিন্ন ক্রিয়াকলাপ ট্র্যাক করে। অ্যাকটিভিটি স্ট্যাটস টুলের মাধ্যমে আপনি উদাহরণস্বরূপ, আপনার দলের কোন সদস্য সবচেয়ে বেশি মন্তব্য করেছে বা সবচেয়ে বেশি টু-ডু আইটেম চেক করেছে তা জানতে পারবেন, এবং প্রকল্প ম্যানেজারদের জন্য আরও বিস্তারিত পরিসংখ্যান পাওয়া যাবে। পরিসংখ্যান দেখার জন্য মজাদার, কিন্তু এগুলো মূল্যায়নের জন্যও ব্যবহার করা যেতে পারে, যেমন একটি ক্লাস প্রকল্পে যেখানে একজন অধ্যাপক নেতৃত্ব দেন।"
COM_PROJECTS_FEATURES_MORE="অন্যান্য অ্যাড-অন্স"
COM_PROJECTS_FEATURES_MORE_ABOUT="আমরা প্রকল্পগুলির মধ্যে জনপ্রিয় পাবলিক অ্যাপগুলির সহযোগিতা সংযুক্ত করার উপায় নিয়ে কাজ করছি। প্রকল্প ফাইলের জন্য GDrive সংযোগ ইতোমধ্যে সমস্ত বা নির্বাচিত প্রকল্পগুলির জন্য উপলব্ধ। আমরা ড্রপবক্স এবং FlyLatex এর সঙ্গে ফাইল সিঙ্ক এবং .tex ফাইল লেখার জন্য সংযোগের দিকেও তাকিয়ে আছি। আমাদের সাথে আপনার ধারণাগুলি শেয়ার করুন! অন্য টুল এবং বৈশিষ্ট্য সুপারিশ করুন যা প্রকল্পগুলিকে আপনার কমিউনিটির জন্য আরও মূল্যবান করতে সহায়তা করবে।"

