COM_PROJECTS_HOWTO_GROUP_EXPLAIN="প্রকল্প তৈরি করা গ্রুপটি প্রাথমিক প্রকল্প টিম তৈরি করে। আপনি যদি গ্রুপের অংশ হন বা গ্রুপে যোগ দেন, আপনি প্রকল্পে অ্যাক্সেস পেতে পারেন। যদি আপনি গ্রুপটি ছেড়ে দেন, তবে কেউ আপনাকে ব্যক্তিগতভাবে পুনরায় যুক্ত না করা পর্যন্ত আপনি প্রকল্পে অ্যাক্সেস হারিয়ে ফেলবেন। প্রকল্পের ভূমিকা (ম্যানেজার/সহযোগী) প্রাথমিকভাবে গ্রুপের ভূমিকা (ম্যানেজার/সদস্য) থেকে উত্তরাধিকারী হয়, তবে এগুলি যেকোনো সময় পৃথকভাবে পরিবর্তন করা যেতে পারে। প্রকল্প নির্মাতা হিসাবে, আপনি শুরু থেকেই ম্যানেজার ভূমিকা পাবেন, যা আপনি প্রকল্প সেটআপ সম্পূর্ণ না হওয়া পর্যন্ত পরিবর্তন করতে পারবেন না।"
COM_PROJECTS_HOWTO_TITLE_BUILD_TEAM="আমার টিমে কে আছে?"
COM_PROJECTS_HOWTO_BUILD_TEAM="প্রকল্পের নির্মাতা হিসাবে, আপনি প্রথম এবং প্রধান টিম সদস্য। আপনি প্রকল্পের সেটআপ সম্পূর্ণ হওয়ার পর এবং যখন অন্যরা আপনার শুরু করা কাজটি গ্রহণ করতে প্রস্তুত, তখন আপনি প্রকল্প ছেড়ে যেতে পারেন। গ্রুপ প্রকল্পের জন্য, সব মূল গ্রুপ সদস্যরা স্বয়ংক্রিয়ভাবে টিমে অন্তর্ভুক্ত হয়।"
COM_PROJECTS_HOWTO_BUILD_TEAM_GROUP="একটি গ্রুপ প্রকল্পের জন্য, সব মূল গ্রুপ সদস্যরা শুরু থেকেই তার টিমে অন্তর্ভুক্ত হয়। যতক্ষণ তারা গ্রুপ সদস্যপদ বজায় রাখে, এই ব্যবহারকারীরা প্রকল্পে কিছু স্তরের অ্যাক্সেস পাবে, যদিও তারা আনুষ্ঠানিকভাবে প্রকল্প ছেড়ে দিয়েছে।"
COM_PROJECTS_HOWTO_TITLE_INVITE_OTHERS="অন্যদের আমন্ত্রণ জানানো"
COM_PROJECTS_HOWTO_INVITE_OTHERS="যদি আপনি ইতিমধ্যে অন্য প্রকল্পগুলোর মাধ্যমে একটি ব্যবহারকারীর সাথে সহযোগিতা করছেন অথবা যদি আপনার সাধারণ গ্রুপ সদস্যপদ থাকে, তাহলে আপনি এই ব্যক্তিকে তাত্ক্ষণিকভাবে আপনার নতুন প্রকল্প টিমে যুক্ত করতে পারেন। যদি এটি আপনার প্রথম সহযোগিতা হয়, তবে প্রকল্প সেটআপ সম্পূর্ণ হওয়ার পর ব্যবহারকারী(গুলির) কাছে একটি আমন্ত্রণ পাঠানো হবে, যাতে তারা এই প্রকল্পে যোগ দেওয়ার জন্য অনুরোধ জানাতে পারে।"

