COM_PROJECTS_SETUP_TERMS_RESTRICTED_STOP_IRB="প্রতিষ্ঠানিক পর্যালোচনা বোর্ড (IRB) অনুমোদন পেয়েছে, এবং আমি নিশ্চিত করি যে আমি আইনগত প্রয়োজনীয়তা অনুসরণ করার জন্য সব প্রকল্প সদস্যের দায়িত্ব নিব।"
