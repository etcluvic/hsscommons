COM_PROJECTS_FEATURES_SETUP="Configuração rápida"
COM_PROJECTS_FEATURES_BLOG="Atualizações & Microblogging"
COM_PROJECTS_FEATURES_BLOG_ABOUT="A página principal do projeto, muito parecida com o Mural do Facebook ou o feed do Twitter, oferece um fluxo de atualizações do projeto de todos os membros da equipe, com a capacidade de comentar sobre certas atividades."
COM_PROJECTS_FEATURES_BLOG_ABOUT_LEARN="A partir do feed de notícias você aprenderá:"
COM_PROJECTS_FEATURES_BLOG_LEARN_TEAM="quando uma nova pessoa entrar no seu projeto"
COM_PROJECTS_FEATURES_BLOG_LEARN_TODO="quando um novo item de tarefa for postado ou marcado como concluído"
COM_PROJECTS_FEATURES_BLOG_LEARN_NOTES="quando alguém adicionar/editar notas do projeto"
COM_PROJECTS_FEATURES_BLOG_LEARN_FILES="quando um novo arquivo for enviado ou atualizado"
COM_PROJECTS_FEATURES_BLOG_LEARN_PUB="atualizações do status da publicação"
COM_PROJECTS_FEATURES_BLOG_LEARN_COMMENT="quando um comentário for feito"
COM_PROJECTS_FEATURES_BLOG_LEARN_BLOG="quando um membro da equipe compartilhar uma atualização ou postar um comentário"
COM_PROJECTS_FEATURES_WANT_FEATURE="Tem um pedido de recurso?"
COM_PROJECTS_FEATURES_SUGGEST_FEATURE="Sugira um recurso"
COM_PROJECTS_FEATURES_SEE_SUGGESTIONS="Veja todas as sugestões"
COM_PROJECTS_FEATURES_TODO_ABOUT="Os projetos incluem uma ferramenta de Tarefas que permite acompanhar sua agenda diária do projeto. Os membros da equipe podem adicionar e editar itens de tarefas, atribuí-los uns aos outros, especificar a data de vencimento, adicionar comentários e marcar itens como concluídos. Também é possível criar múltiplas (até 10) listas de tarefas."
COM_PROJECTS_FEATURES_NOTES="Notas do Projeto"
COM_PROJECTS_FEATURES_NOTES_ABOUT="Notas do Projeto é a área de wiki para o seu projeto, onde você pode registrar comentários mais detalhados, esboçar ideias, elaborar a agenda de desenvolvimento ou usar esse espaço livre para facilitar a colaboração e impulsionar seu projeto. Você pode adicionar várias páginas e subpáginas, criar modelos de wiki, incorporar imagens e arquivos do projeto e usar outros recursos populares de wiki disponíveis no site."
COM_PROJECTS_FEATURES_NOTES_PLANNED_ONE="Capacidade de anexar notas selecionadas às publicações do projeto como material de apoio ou conteúdo principal"
COM_PROJECTS_FEATURES_TEAM="Equipe do Projeto"
COM_PROJECTS_FEATURES_TEAM_ABOUT="Um projeto pode ser criado por um usuário individual ou por um grupo. Seja qual for o caso, os gerentes do projeto podem expandir sua equipe adicionando outros usuários e grupos aos quais pertencem. Eles também podem convidar colaboradores externos por e-mail. A interface de gerenciamento de equipe permite atribuir papéis de gerente/colaborador ou leitura restrita aos membros da equipe."
COM_PROJECTS_FEATURES_FILES="Gerenciamento de Arquivos"
COM_PROJECTS_FEATURES_FILES_ABOUT_START="Os projetos fornecem várias opções de compartilhamento de arquivos. Por exemplo, você pode compartilhar arquivos com sua equipe usando serviços populares como GitHub, Google Drive e Dropbox. Cada projeto também vem com um"
COM_PROJECTS_FEATURES_FILES_ABOUT_GIT="repositório Git"
COM_PROJECTS_FEATURES_FILES_ABOUT_END="para armazenar seus arquivos e dados. Com isso, vem um navegador de arquivos web embutido, que lê o repositório e permite fazer uploads de múltiplos arquivos, excluir, renomear e mover arquivos, compilar arquivos LaTeX em PDF, além de visualizar o histórico de arquivos e diferenças de revisões ou baixar todas as versões anteriores."
COM_PROJECTS_FEATURES_FILES_PLANNED_ONE="Melhor visualização de arquivos, incluindo DOCs e PDFs"
COM_PROJECTS_FEATURES_FILES_PLANNED_TWO="Diferenças entre versões de documentos lado a lado"
COM_PROJECTS_FEATURES_FILES_PLANNED_THREE="Mais opções de gerenciamento de arquivos"
COM_PROJECTS_FEATURES_APPS="Desenvolvimento de Apps"
COM_PROJECTS_FEATURES_APPS_ABOUT_START="Projetos voltados para o desenvolvimento de aplicativos recebem uma área especial para registrar, gerenciar, testar e publicar seus aplicativos. Cada aplicativo registrado recebe seu próprio"
COM_PROJECTS_FEATURES_APPS_ABOUT_GIT="repositório Git"
COM_PROJECTS_FEATURES_APPS_ABOUT_END="para o código, que você pode navegar através do navegador de arquivos do projeto."
COM_PROJECTS_FEATURES_APPS_PLANNED_ONE="Melhor visualização de arquivos, incluindo DOCs e PDFs"
COM_PROJECTS_FEATURES_APPS_PLANNED_TWO="Diferenças entre versões de documentos lado a lado"
COM_PROJECTS_FEATURES_APPS_PLANNED_THREE="Um navegador de arquivos web mais avançado"
COM_PROJECTS_FEATURES_PUBLICATIONS="Publicação"
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT_WIP="Os projetos integram um mecanismo de publicação para enviar seus materiais de projeto para o mundo na forma de publicações web. Cada publicação liberada recebe um Identificador de Objeto Digital (DOI) para que outros possam citar seu trabalho. O público pode deixar comentários, abrir tickets de suporte e adicionar ideias à lista de desejos de cada publicação. No futuro, os Projetos permitirão publicar não apenas arquivos ou aplicativos selecionados, mas também coleções de recursos, materiais wiki e links para sites externos."
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT="Os projetos integram um mecanismo de publicação para enviar seus materiais de projeto para o mundo na forma de publicações web. Cada versão publicada receberá um Identificador de Objeto Digital (DOI) para que outros possam citar seu trabalho. O público pode deixar comentários, abrir tickets de suporte e adicionar ideias à lista de desejos de cada publicação. No futuro, os Projetos permitirão publicar não apenas arquivos do projeto selecionados, mas também aplicativos do projeto, bancos de dados interativos, coleções de recursos, materiais wiki e links para sites externos."
COM_PROJECTS_FEATURES_IN_THE_WORKS="*em andamento"
COM_PROJECTS_FEATURES_ACTIVITY="Estatísticas de Atividades"
COM_PROJECTS_FEATURES_ACTIVITY_ABOUT="Os projetos acompanham as várias atividades realizadas pelos seus membros. Com a ferramenta de estatísticas de atividades, você poderá descobrir, por exemplo, quem na sua equipe fez mais comentários ou concluiu mais itens de tarefa, com estatísticas mais elaboradas disponíveis para os gerentes do projeto. As estatísticas são divertidas de assistir, mas também podem ser usadas para avaliações, por exemplo, em projetos de classe liderados por um professor."
COM_PROJECTS_FEATURES_MORE="Outros Complementos"
COM_PROJECTS_FEATURES_MORE_ABOUT="Estamos buscando maneiras de integrar aplicativos públicos populares de colaboração aos projetos. A conexão com o GDrive para Arquivos do Projeto já está disponível para todos ou projetos selecionados. Também estamos analisando a integração com o Dropbox e o FlyLatex para sincronização de arquivos e escrita de arquivos .tex. Compartilhe suas ideias conosco! Recomende outras ferramentas e recursos que ajudem a tornar os Projetos mais valiosos para sua comunidade."

