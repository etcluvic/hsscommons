COM_PROJECTS_HOWTO_GROUP_PROJECT="Projetos em Grupo: como funciona a associação?"
COM_PROJECTS_HOWTO_GROUP_EXPLAIN="O grupo que cria um projeto forma a equipe inicial do projeto. Se você pertence ou ingressa no grupo, pode acessar o projeto. Se sair do grupo, perderá o acesso ao projeto, a menos que alguém o adicione individualmente depois. As funções do projeto (gerente/colaborador) são inicialmente herdadas das funções do grupo (gerente/membro), mas podem ser alteradas a qualquer momento. Como criador do projeto, você recebe a função de gerente desde o início, e essa função não pode ser alterada até a conclusão da configuração do projeto."
COM_PROJECTS_HOWTO_TITLE_BUILD_TEAM="Quem está na minha equipe?"
COM_PROJECTS_HOWTO_BUILD_TEAM="Como criador do projeto, você é o primeiro e principal membro da equipe. Você pode sair do projeto após a conclusão da configuração, desde que haja outros membros para assumir o que você começou. Para projetos em grupo, todos os membros originais do grupo são incluídos por padrão."
COM_PROJECTS_HOWTO_BUILD_TEAM_GROUP="Para um projeto em grupo, todos os membros originais do grupo são incluídos na equipe desde o início. Enquanto permanecerem no grupo, esses usuários terão algum nível de acesso ao projeto, mesmo que formalmente o deixem."
COM_PROJECTS_HOWTO_TITLE_INVITE_OTHERS="Convidando outras pessoas para participar"
COM_PROJECTS_HOWTO_INVITE_OTHERS="Se você já está colaborando com um usuário em outros projetos ou pertence ao mesmo grupo, pode adicioná-lo instantaneamente à sua nova equipe de projeto. Se esta for sua primeira colaboração, um convite será enviado ao(s) usuário(s) solicitando que participem do projeto assim que a configuração for concluída."

