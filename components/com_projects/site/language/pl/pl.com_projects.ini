COM_PROJECTS_FEATURES_SUGGEST_FEATURE="Prześlij sugestię"
COM_PROJECTS_FEATURES_SEE_SUGGESTIONS="Przeglądaj sugestie"
COM_PROJECTS_FEATURES_TODO_ABOUT="Projekty umożliwiają korzystanie z listy zadań, zawierającej bieżące informacje o postępach projektu. Członkowie zespołu mogą dodawać i edytować zadania, przypisywać je do konkretnego użytkownika, dodawać do nich komentarze i oznaczać jako wykonane. Można utworzyć do 10 list."
COM_PROJECTS_FEATURES_NOTES="Notatki w projekcie"
COM_PROJECTS_FEATURES_NOTES_ABOUT="Notatki w projekcie przechowywane są w formie artykułów wiki - tam znajdują się rozszerzone komentarze i szkice oraz miejsce na dyskusję. Notatki umożliwiają tworzenie wielu stron i podstron, szablonów wiki, dodawanie obrazów i plików oraz korzystanie z innych funkcji dostępnych w serwisie."
COM_PROJECTS_FEATURES_NOTES_PLANNED_ONE="Możliwość dodawania wybranych notatek do publikacji w projekcie, jako dodatkowego materiału wiki lub jako głównej treści."
COM_PROJECTS_FEATURES_TEAM="Zespół projektowy"
COM_PROJECTS_FEATURES_TEAM_ABOUT="Projekty mogą być tworzone przez indywidualnych użytkowników lub przez grupy. Administratorzy projektu mogą następnie rozszerzyć zespół, dodając kolejnych użytkowników lub grupy do których należą. Zewnętrznych współpracowników można zaprosić przez e-mail. Interfejs administratora zespołu umożliwia przypisywanie członkom zespołu ról administratora, współpracownika, lub włączenie dostępu tylko do odczytu."
COM_PROJECTS_FEATURES_FILES="Zarządzanie plikami"
COM_PROJECTS_FEATURES_FILES_ABOUT_START="Istnieje wiele możliwości udostępniania plików w obrębie projektu - między innymi przy użyciu takich usług jak GitHub, Google Drive lub Dropbox. Każdy projekt zawiera też repozytorium"
COM_PROJECTS_FEATURES_FILES_ABOUT_GIT="Git"
COM_PROJECTS_FEATURES_FILES_ABOUT_END="do przechowywania plików i danych. Repozytorium jest obsługiwane przy użyciu wbudowanej przeglądarki plików, umożliwiającej dodawanie wielu plików, usuwanie, zmianę nazwy i przenoszenie, kompilację plików LaTeX do formatu PDF, oraz przeglądanie historii plików i poprawek (włącznie z pobieraniem poprzednich wersji)."
COM_PROJECTS_FEATURES_FILES_PLANNED_ONE="Lepszy podgląd plików, między innymi w formatach DOC i PDF."
COM_PROJECTS_FEATURES_FILES_PLANNED_TWO="Porównywanie wersji dokumentów w dwóch kolumnach"
COM_PROJECTS_FEATURES_FILES_PLANNED_THREE="Dalsze opcje zarządzania plikami"
COM_PROJECTS_FEATURES_APPS="Rozwój aplikacji"
COM_PROJECTS_FEATURES_APPS_ABOUT_START="Projekty ukierunkowane na rozwój aplikacji uzyskują przestrzeń do rejestracji, zarządzania, testowania i publikacji. Każda zarejestrowana aplikacja uzyskuje własne repozytorium"
COM_PROJECTS_FEATURES_APPS_ABOUT_GIT="Git"
COM_PROJECTS_FEATURES_APPS_ABOUT_END="do przechowywania kodu, które można przeglądać przy użyciu wbudowanej przeglądarki."
COM_PROJECTS_FEATURES_APPS_PLANNED_ONE="Lepszy podgląd plików, między innymi w formatach DOC i PDF"
COM_PROJECTS_FEATURES_APPS_PLANNED_TWO="Porównywanie wersji dokumentów w dwóch kolumnach"
COM_PROJECTS_FEATURES_APPS_PLANNED_THREE="Zaawansowany przeglądarkowy menedżer plików"
COM_PROJECTS_FEATURES_PUBLICATIONS="Publikacja"
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT_WIP="Projekty w serwisie są połączone z mechanizmem publikacji, który rozpowszechnia materiały w formie publikacji webowych. Każda publikacja otrzymuje identyfikator DOI, umożliwiający cytowanie. Odbiorcy mogą komentować materiały w serwisie, oraz zgłaszać problemy techniczne lub sugestie. W przyszłości, projekty będą umożliwiały publikację nie tylko plików i aplikacji, ale też zbiorów zasobów, materiałów wiki oraz zbiorów odnośników do stron zewnętrznych."
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT="Projekty w serwisie są połączone z mechanizmem publikacji, który rozpowszechnia materiały w formie publikacji webowych. Każda publikacja otrzymuje identyfikator DOI, umożliwiający cytowanie. Odbiorcy mogą komentować materiały w serwisie, oraz zgłaszać problemy techniczne lub sugestie. W przyszłości, projekty będą umożliwiały publikację nie tylko plików i aplikacji, ale też zbiorów zasobów, materiałów wiki oraz zbiorów odnośników do stron zewnętrznych."
COM_PROJECTS_FEATURES_IN_THE_WORKS="*w przygotowaniu"
COM_PROJECTS_FEATURES_ACTIVITY="Statystyki aktywności"
COM_PROJECTS_FEATURES_ACTIVITY_ABOUT="W projektach przechowywane są dane o aktywności członków zespołu. Statystyki aktywności pozwalają ustalić, kiedy zespół dodał najwięcej komentarzy czy wykonał najwięcej zadań. Administratorzy uzyskują dostęp do bardziej szczegółowych statystyk. Statystyki mogą też być wykorzystywane w pracy dydaktycznej, do oceny zadań wykonywanych przez studentów."
COM_PROJECTS_FEATURES_MORE="Inne dodatki"
COM_PROJECTS_FEATURES_MORE_ABOUT="Trwają prace nad integracją serwisu z popularnymi aplikacjami. Obecnie można już podpiąć Google Drive do plików projektu. Planowana jest też integracja z Dropboxem (synchronizacja plikówi FlyLatexem (edycja plików .tex). Zachęcamy użytkowników do zgłaszania sugestii dotyczących narzędzi i opcji, które moglibyśmy dodać do serwisu."

