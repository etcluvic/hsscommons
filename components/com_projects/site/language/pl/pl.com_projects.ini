COM_PROJECTS_HOWTO_GROUP_PROJECT="Projekty grupowe: na czym polega członkostwo"
COM_PROJECTS_HOWTO_GROUP_EXPLAIN="Grupa tworząca projekt stanowi zarazem zespół powstałego projektu. Członkostwo w grupie lub dołączenie do niej pozwala na dostęp do projektu. Po opuszczeniu grupy, użytkownik traci dostęp do projektu, dopóki nie otrzyma ponownego zaproszenia. Funkcje w projekcie domyślnie są przenoszone z funkcji w grupie (administrator/członek), ale można zmieniać je indywidualnie. Twórca projektu od początku jest administratorem i nie może zrzec się tej funkcji przed ukończeniem konfiguracji projektu."
COM_PROJECTS_HOWTO_TITLE_BUILD_TEAM="Kto należy do zespołu?"
COM_PROJECTS_HOWTO_BUILD_TEAM="Twórca projektu jest pierwszym i najważniejszym członkiem zespołu. Może opuścić zespół po ukończeniu konfiguracji i przekazać rolę administratora innym użytkownikom. W przypadku projektów tworzonych przez grupę, wszyscy członkowie grupy są domyślnie członkami zespołu projektowego."
COM_PROJECTS_HOWTO_BUILD_TEAM_GROUP="W przypadku projektów tworzonych przez grupę, wszyscy członkowie grupy są domyślnie członkami zespołu. Członkowie grupy zachowują częściowy dostęp do projektu, nawet jeżeli go opuszczą."
COM_PROJECTS_HOWTO_TITLE_INVITE_OTHERS="Jak dodawać użytkowników"
COM_PROJECTS_HOWTO_INVITE_OTHERS="Twórca projektu może od razu dodać do zespołu użytkowników z którymi współpracuje nad innymi projektami lub którzy należą do tych samych grup. W innym przypadku użytkownik otrzyma zaproszenie do współpracy po ukończeniu konfiguracji projektu."

