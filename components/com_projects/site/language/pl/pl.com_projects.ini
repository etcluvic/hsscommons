COM_PROJECTS_SETUP_TERMS_GRANTINFO_BECAUSE="Informacje o przyznanych grantach pozwalają nam przydzielić stosowną ilość miejsca na dysku do użycia w projekcie. Jeżeli nie podano informacji o grancie, projekt uzyskuje domyślną ilość miejsca. Można też podać szczegóły dotyczące finansowania i wnioskować o więcej miejsca na dysku w późniejszym terminie."
COM_PROJECTS_HOWTO_GRANTINFO_WHY="W jakim celu wprowadzać informacje o grancie?"
COM_PROJECTS_HOWTO_GRANTINFO_BECAUSE="Informacje o przyznanych grantach pozwalają nam przydzielić stosowną ilość miejsca na dysku do użycia w projekcie. Jeżeli nie podano informacji o grancie, projekt uzyskuje domyślną ilość miejsca."
COM_PROJECTS_HOWTO_PUBLIC_PAGE="Projekty publiczne"
COM_PROJECTS_HOWTO_PUBLIC_PAGE_EXPLAIN="Projekty publiczne są wymienione w publicznym katalogu projektów - podstawowe informacje o projekcie będą widoczne dla użytkowników i gości serwisu."
COM_PROJECTS_SETUP_TERMS_QUESTION_MAKE_CHOICE="Proszę podać rodzaj danych, które mogą być wykorzystywane w projekcie. Jeżeli nie wiadomo - proszę na wszelki wypadek zaznaczyć daną opcję."
COM_PROJECTS_SETUP_FOLLOW_UP_NECESSARY="potrzebne dalsze informacje"
COM_PROJECTS_SETUP_TERMS_RESTRICTED_EXPLAIN="<p>Dane wrażliwe mogą obejmować informacje osobiste, finansowe i prawne, jak również informacje chronione przez prawa państwowe lub stanowe oraz regulacje wewnętrzne uczelni. <span class="_QQ_"prominent dark"_QQ_">Serwis nie może być wykorzystywany do przechowywania informacji zastrzeżonych przez rząd państwa, podlegających ograniczeniom eksportowym, danych własnościowych firm (bez ich zgody), ani chronionych informacji zdrowotnych podlegających zapisom HIPAA</span> Projekty zawierające dane zastrzeżone w myśl przepisów FERPA muszą zostać rozpatrzone przez odpowiednich pracowników Uniwersytetu. Dane wymagające zatwierdzenia przez Institutional Review Board (IRB) mogą być przechowywane w serwisie tylko po uzyskaniu stosownego zaświadczenia.</p><p class="_QQ_"prominent"_QQ_">Proszę kliknąć “kontynuuj” poniżej, żeby przejść dalej.</p>"

COM_PROJECTS_CONTINUE="Kontynuuj"
COM_PROJECTS_SETUP_TERMS_RESTRICTED_UPFRONT_WHY="W jakim celu pytamy o dane?"
COM_PROJECTS_SETUP_TERMS_RESTRICTED_UPFRONT_BECAUSE="Projekty nie mogą być wykorzystywane do przechowywania niektórych rodzajów danych wrażliwych lub zastrzeżonych. Informujemy o tych ograniczeniach przed przejściem do następnych etapów tworzenia projektu. Jeżeli nie wiadomo, czy w projekcie pojawią się dane wrażliwe - proszę odpowiedzieć “tak” i zapoznać się z informacjami dotyczącymi danych chronionych. Na końcu procesu tworzenia projektu pojawi się pytanie o zatwierdzenie wcześniejszych odpowiedzi."
