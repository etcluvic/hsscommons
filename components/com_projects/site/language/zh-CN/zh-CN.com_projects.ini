COM_PROJECTS_FEATURES_TODO_ABOUT="项目内置了简洁高效的待办事项工具，帮助您跟踪日常项目安排。项目成员可以新增和编辑待办事项，相互分配任务，设置截止日期，添加评论，并将事项标记为完成。同时还支持创建多个（最多 10 个）待办事项列表。"
COM_PROJECTS_FEATURES_NOTES="项目笔记"
COM_PROJECTS_FEATURES_NOTES_ABOUT="项目笔记是项目的 Wiki 区域，您可以在这里记录详细说明、构思想法、展开开发计划，或以自由书写的方式促进协作并推动项目进展。您可以创建多个页面和子页面，使用 Wiki 模板，嵌入项目图片和文件，并使用站点内提供的其他常见 Wiki 功能。"
COM_PROJECTS_FEATURES_NOTES_PLANNED_ONE="支持将选定的项目笔记附加到项目出版物中，作为辅助 Wiki 材料或主要内容"
COM_PROJECTS_FEATURES_TEAM="项目团队"
COM_PROJECTS_FEATURES_TEAM_ABOUT="项目可以由个人用户或群组创建。无论采用哪种方式，项目管理员都可以通过添加所属的其他用户或群组来扩展团队，也可以通过电子邮件邀请外部合作者。团队管理界面支持为成员分配管理员、协作者或只读角色。"
COM_PROJECTS_FEATURES_FILES="文件管理"
COM_PROJECTS_FEATURES_FILES_ABOUT_START="项目提供多种文件共享方式。例如，您可以通过 GitHub、Google Drive 或 Dropbox 等常见服务与团队共享文件。每个项目还自带一个"
COM_PROJECTS_FEATURES_FILES_ABOUT_GIT="Git"
COM_PROJECTS_FEATURES_FILES_ABOUT_END="资源库，用于存储文件和数据。系统同时提供内置的网页文件浏览器，可读取资源库内容，支持多文件上传、删除、重命名和移动文件，将 LaTeX 文件编译为 PDF，以及查看文件历史、比较不同版本差异或下载所有历史版本。"
COM_PROJECTS_FEATURES_FILES_PLANNED_ONE="更好的文件预览功能，包括 DOC 和 PDF 文件"
COM_PROJECTS_FEATURES_FILES_PLANNED_TWO="文档版本的并排差异对比"
COM_PROJECTS_FEATURES_FILES_PLANNED_THREE="更多文件管理选项"
COM_PROJECTS_FEATURES_APPS="应用开发"
COM_PROJECTS_FEATURES_APPS_ABOUT_START="面向应用开发的项目将获得一个专门区域，用于注册、管理、测试和发布应用。每个已注册的应用都会拥有一个独立的"
COM_PROJECTS_FEATURES_APPS_ABOUT_GIT="Git"
COM_PROJECTS_FEATURES_APPS_ABOUT_END="资源库，您可以通过项目的文件浏览器对其进行查看。"
COM_PROJECTS_FEATURES_APPS_PLANNED_ONE="更好的文件预览功能，包括 DOC 和 PDF 文件"
COM_PROJECTS_FEATURES_APPS_PLANNED_TWO="文档版本的并排差异对比"
COM_PROJECTS_FEATURES_APPS_PLANNED_THREE="更高级的网页文件浏览器"
COM_PROJECTS_FEATURES_PUBLICATIONS="出版发布"
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT_WIP="项目集成了出版引擎，可将项目成果以网页出版物的形式发布给公众。每一项已发布的出版物都会获得一个数字对象标识符（DOI），便于他人引用您的工作。公众可以对出版物发表评论、提交支持请求，并在愿望清单中提出改进建议。未来，Projects 不仅支持发布选定的项目文件或应用，还将支持发布资源集合、Wiki 内容以及指向外部网站的链接。"
COM_PROJECTS_FEATURES_PUBLICATIONS_ABOUT="项目集成了出版引擎，可将项目成果以网页出版物的形式发布给公众。每一个公开发布的版本都会获得一个数字对象标识符（DOI），以便他人引用您的研究成果。公众可以对出版物发表评论、提交支持请求，并在愿望清单中提出想法。未来，Projects 不仅支持发布选定的项目文件，还将支持发布项目应用、交互式数据库、资源集合、Wiki 内容以及指向外部网站的链接。"
COM_PROJECTS_FEATURES_IN_THE_WORKS="*正在开发中"
COM_PROJECTS_FEATURES_ACTIVITY="活动统计"
COM_PROJECTS_FEATURES_ACTIVITY_ABOUT="Projects 会记录成员执行的各类活动。通过活动统计工具，您可以了解例如团队中谁发表的评论最多、谁完成的待办事项最多等情况；项目管理员还可以查看更为详细的统计数据。这些统计信息不仅有趣，也可用于评估，例如在教师主导的课程项目中。"
COM_PROJECTS_FEATURES_MORE="其他扩展功能"
COM_PROJECTS_FEATURES_MORE_ABOUT="我们正在探索将常用的公共协作应用集成到项目中的方式。目前，项目文件已支持 Google Drive（GDrive）连接，可对全部或部分项目启用。我们也在考虑与 Dropbox 和 FlyLatex 集成，以实现文件同步和 .tex 文件写作。欢迎与我们分享您的想法，推荐其他能够提升 Projects 对社区价值的工具和功能。"

