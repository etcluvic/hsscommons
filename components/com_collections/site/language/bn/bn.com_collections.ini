; Getting Started
COM_COLLECTIONS_TAGLINE="একটি কেন্দ্রে তথ্য শেয়ার, প্রিয় তালিকাভুক্ত এবং সংগঠিত করার একটি দ্রুত ও সহজ উপায়।"
COM_COLLECTIONS_POST="পোস্ট"
COM_COLLECTIONS_POST_EXPLANATION="একটি পোস্ট একটি ছবি, লিঙ্ক, বা ফাইল দিয়ে শুরু হয় যা আপনি শেয়ার করতে চান। আপনার পোস্টের জন্য আপনি সাইট থেকে কন্টেন্ট সংগ্রহ করতে পারেন অথবা আপনার কম্পিউটার থেকে সরাসরি একটি ফাইল আপলোড করতে পারেন। যেকোনো পোস্ট পুনরায় পোস্ট করা যেতে পারে, এবং তা মূল পোস্টের সাথে লিঙ্কড অবস্থায় থাকে।"
COM_COLLECTIONS_COLLECTION="কালেকশন"
COM_COLLECTIONS_COLLECTION_EXPLANATION="একটি কালেকশন হলো এমন একটি জায়গা যেখানে আপনি আপনার পোস্টগুলো বিষয় অনুযায়ী সাজিয়ে রাখতে পারেন।যেমন, আপনি ডিজিটাল হিউম্যানিটিসে একটি ভূমিকা তৈরি করার জন্য প্রয়োজনীয় রিসোর্স সংগ্রহ করতে পারেন। কালেকশনগুলো ব্যাক্তিগত বা জনউন্মুক্ত হতে পারে, এবং আপনি একটি কালেকশনের ভিতরে অন্য একটি কালেকশনও রাখতে পারেন!"
COM_COLLECTIONS_FOLLOW="অনুসরণ করুন"
COM_COLLECTIONS_FOLLOW_EXPLANATION="যখন আপনি কাউকে অনুসরণ করেন, তাদের পোস্টগুলি আপনার <a href="_QQ_"%s"_QQ_">লাইফ ফিডে</a> দেখাব্যে। আপনি কারো সকল কালেকশন অথবা শুধুমাত্র আপনার পছন্দসই কালেকশনগুলো অনুসরণ করতে পারেন। আপনি কাকে অনুসরণ করছেন তা জানতে আপনার <a href="QQ"%s"QQ">প্রোফাইল</a>এ যান, <a href="QQ"%s"QQ">কালেকশন</a> খুঁজুন, এবং Following ক্লিক করুন।"
COM_COLLECTIONS_UNFOLLOW="অনুসরণ করা বন্ধ করুন"
COM_COLLECTIONS_UNFOLLOW_EXPLANATION="আপনি কাউকে অনুসরণ বন্ধ করে দিলে তাদের কালেকশন আপনার <a href="QQ"%s"QQ">লাইভ ফিড</a>-এ আর দেখাবে না। আপনি কারোর সকল সংগ্রহ অনুসরণ করা বন্ধ করতে পারেন, অথবা শুধুমাত্র সেগুলো যেগুলোর প্রতি আপনার আগ্রহ কম সে গুলো অনুসরণ করা বন্ধ করতে পারেন।"
COM_COLLECTIONS_LIVE_FEED="লাইভ ফিড"
COM_COLLECTIONS_LIVE_FEED_EXPLANATION="আপনার <a href="QQ"%s"QQ">লাইভ ফিড</a> হল অনুসরণ করা সংগ্রাহক এবং কালেকশনের পোস্টগুলির একটি সংগ্রহ। প্রতিবার আপনার অনুসরণ করা কেউ একটি পোস্ট যোগ করলে এটি আপডেট হয়।"
