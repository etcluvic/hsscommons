; Getting Started
 COM_COLLECTIONS_TAGLINE="Uma maneira simples e eficiente de compartilhar, favoritar e organizar informações em um hub."
 COM_COLLECTIONS_POST="Postar"
 COM_COLLECTIONS_POST_EXPLANATION="Uma postagem começa com uma imagem, link ou arquivo que você deseja compartilhar. Você pode criar uma postagem coletando conteúdo do site ou enviando um arquivo diretamente do seu dispositivo. As postagens podem ser republicadas e sempre vinculam de volta à sua fonte."
 COM_COLLECTIONS_COLLECTION="Coleção"
 COM_COLLECTIONS_COLLECTION_EXPLANATION="Uma coleção é onde você organiza postagens por tópicos. Por exemplo, você pode reunir recursos para uma introdução às Humanidades Digitais. As coleções podem ser privadas ou públicas e você pode aninhar uma coleção dentro de outra."
 COM_COLLECTIONS_FOLLOW="Seguir"
 COM_COLLECTIONS_FOLLOW_EXPLANATION="Quando você segue alguém, as postagens dessa pessoa aparecem no seu <a href="QQ"%s"QQ">feed ao vivo. Você pode seguir todas as coleções de alguém ou apenas coleções específicas. Para gerenciar quem você segue, visite seu <a href="QQ"%s"QQ">perfil, localize <a href="QQ"%s"QQ">Coleções e clique em Seguindo."
 COM_COLLECTIONS_UNFOLLOW="Deixar de seguir"
 COM_COLLECTIONS_UNFOLLOW_EXPLANATION="Quando você deixa de seguir alguém, as coleções dessa pessoa não aparecerão mais no seu <a href="QQ"%s"QQ">feed ao vivo. Você pode deixar de seguir todas as coleções de alguém ou apenas aquelas que não lhe interessam."
 COM_COLLECTIONS_LIVE_FEED="Feed ao vivo"
 COM_COLLECTIONS_LIVE_FEED_EXPLANATION="Seu <a href="QQ"%s"QQ">feed ao vivo é um fluxo de postagens de colecionadores e coleções que você segue. Ele é atualizado sempre que alguém que você segue adiciona uma postagem."

