; Getting Started
COM_COLLECTIONS_TAGLINE="一种快速便捷的方式，用于在平台上分享、收藏并整理信息。"
COM_COLLECTIONS_POST="帖子"
COM_COLLECTIONS_POST_EXPLANATION="帖子通常以您想要分享的图片、链接或文件为起点。您可以通过收藏站内内容或直接从计算机上传文件来添加帖子。任何帖子都可以被再次转发，且所有帖子都会链接回其来源。"
COM_COLLECTIONS_COLLECTION="收藏集"
COM_COLLECTIONS_COLLECTION_EXPLANATION="收藏集用于按主题整理您的帖子。例如，您可以收集用于创建数字人文入门内容的相关资源。收藏集可以设置为私密或公开，您甚至可以将一个收藏集放入另一个收藏集中！"
COM_COLLECTIONS_FOLLOW="关注"
COM_COLLECTIONS_FOLLOW_EXPLANATION="当您关注某位用户时，其发布的帖子将显示在您的 <a href="_QQ_"%s"_QQ_">实时动态</a> 中。您可以关注某位用户的所有收藏集，或仅关注您最感兴趣的部分。要管理您关注的对象，请前往您的 <a href="_QQ_"%s"_QQ_">个人主页</a>，找到 <a href="_QQ_"%s"_QQ_">收藏集</a>，然后点击“正在关注”。"
COM_COLLECTIONS_UNFOLLOW="取消关注"
COM_COLLECTIONS_UNFOLLOW_EXPLANATION="当您取消关注某位用户时，其收藏集将不再显示在您的 <a href="_QQ_"%s"_QQ_">实时动态</a> 中。您可以取消关注该用户的所有收藏集，或仅取消关注您不太感兴趣的部分。"
COM_COLLECTIONS_LIVE_FEED="实时动态"
COM_COLLECTIONS_LIVE_FEED_EXPLANATION="您的 <a href="_QQ_"%s"_QQ_">实时动态</a> 汇集了您所关注的收藏者及其收藏集发布的帖子。每当您关注的对象新增帖子时，该动态都会自动更新。"

