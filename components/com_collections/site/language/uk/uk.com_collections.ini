; Getting Started
COM_COLLECTIONS_TAGLINE="Швидкий і простий спосіб ділитися, вподобувати та організовувати інформацію в одному хабі."
COM_COLLECTIONS_POST="Допис"
COM_COLLECTIONS_POST_EXPLANATION="Допис починається із зображення, посилання або файлу, яким ви хочете поділитися. Ви можете додати допис, зібравши контент на сайті, або завантажити файл з комп’ютера. Будь-який допис можна репостити, і всі дописи ведуть до свого джерела."
COM_COLLECTIONS_COLLECTION="Колекція"
COM_COLLECTIONS_COLLECTION_EXPLANATION="Колекція — це місце, де ви організовуєте свої дописи за темами. Наприклад, ви можете зібрати ресурси для створення вступу до цифрових гуманітарних наук. Колекції можуть бути публічними або приватними, і ви навіть можете розміщувати колекції всередині інших колекцій!"
COM_COLLECTIONS_FOLLOW="Підписатися"
COM_COLLECTIONS_FOLLOW_EXPLANATION="Коли ви стежите за кимось, їхні дописи з’являються у вашій <a href=\"_QQ_\"%s\"_QQ_\">стрічці оновлень</a>. Ви можете стежити за всіма колекціями користувача або лише за тими, що вам до вподоби. Щоб керувати списком відстежуваних, перейдіть до свого <a href=\"_QQ_\"%s\"_QQ_\">профілю</a>, знайдіть <a href=\"_QQ_\"%s\"_QQ_\">Колекції</a> і натисніть «Стежити»."
COM_COLLECTIONS_UNFOLLOW="Відписатися"
COM_COLLECTIONS_UNFOLLOW_EXPLANATION="Коли ви відписуєтеся від користувача, його колекції більше не з’являтимуться у вашій <a href=\"_QQ_\"%s\"_QQ_\">стрічці оновлень</a>. Ви можете відписатися від усіх колекцій користувача або лише від тих, які вас не цікавлять."
COM_COLLECTIONS_LIVE_FEED="Стрічка оновлень"
COM_COLLECTIONS_LIVE_FEED_EXPLANATION="Ваша <a href=\"_QQ_\"%s\"_QQ_\">стрічка оновлень</a> — це збірка дописів від користувачів і колекцій, за якими ви стежите. Вона оновлюється щоразу, коли хтось із відстежуваних додає новий допис."

