; Getting Started
COM_COLLECTIONS_TAGLINE="Szybka i prosta metoda udostępniania, oceny i organizowania materiałów w serwisie."
COM_COLLECTIONS_POST="Wpis"
COM_COLLECTIONS_POST_EXPLANATION="Wpisy zawierają obrazy, linki lub pliki, które użytkownik chce udostępnić. Mogą zawierać materiał znaleziony w serwisie lub dodany bezpośrednio z dysku. Każdy wpis może być przekazany dalej, a linki zawarte we wpisach zachowują lokalizację źródła."
COM_COLLECTIONS_COLLECTION="Kolekcje"
COM_COLLECTIONS_COLLECTION_EXPLANATION="Kolekcje służą do organizowania wpisów według tematu - mogłaby zawierać, na przykład, materiały zebrane na potrzeby kursu dotyczącego komunikacji w środowisku naukowym. Kolekcje mogą być prywatne lub publiczne. Można też umieszczać kolekcje wewnątrz innych kolekcji."
COM_COLLECTIONS_FOLLOW="Obserwuj"
COM_COLLECTIONS_FOLLOW_EXPLANATION="Wpisy obserwowanego użytkownika pojawiają się na <a href="_QQ_"%s"_QQ_">tablicy</a>. Można obserwować wszystkie lub wybrane kolekcje danego użytkownika. Listę obsewowanych użytkowników można sprawdzić lub zmodyfikować we własnym <a href="_QQ_"%s"_QQ_">profilu</a>, po kliknięciu opcji <a href="_QQ_"%s"_QQ_">Kolekcje</a>, a następnie: Obserwowanie."
COM_COLLECTIONS_UNFOLLOW="Przestań obserwować"
COM_COLLECTIONS_UNFOLLOW_EXPLANATION="Po zaprzestaniu obserwowania kolekcje danego użytkownika przestają pojawiać się na <a href="_QQ_"%s"_QQ_">tablicy</a>. Można przestać obserwować wszystkie lub wybrane kolekcje wybranego użytkownika."
COM_COLLECTIONS_LIVE_FEED="Tablica"
COM_COLLECTIONS_LIVE_FEED_EXPLANATION="<a href="_QQ_"%s"_QQ_">Tablica</a> użytkownika to zbiór wpisów obserwowanych użytkowników i zawartości ich kolekcji. Jest uaktualniana przy każdym wpisie dodanym przez obserwowanego użytkownika."

