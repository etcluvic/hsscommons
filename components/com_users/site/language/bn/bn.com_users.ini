; Spam
COM_USERS_SPAM_DETECTED="স্প্যাম সনাক্ত হয়েছে"
COM_USERS_SPAM_MESSAGE="উহ-ওহ। আমরা আপনার অ্যাকাউন্ট থেকে স্প্যামমতো আচরণ সনাক্ত করেছি। এর মানে এই নয় যে আপনি স্প্যামার, কিন্তু এটা এখনই অনেকটা তাই দেখাচ্ছে। যদি এটা ভুল হয়, আমরা আন্তরিকভাবে দুঃখিত। অনুগ্রহ করে উপরের ড্রপডাউন ব্যবহার করে একটি সহায়তা টিকিট জমা দিন এবং আমাদের জানান। তবে, যদি আপনি স্প্যামার হন... থামুন। এটা খুবই বিরক্তিকর।"
COM_USERS_SPAM_VIDEO="আপনি যদি স্প্যামার না হন, তাহলে দুঃখ প্রকাশের জন্য আমরা নিচেরটি উপস্থাপন করছি। আপনি যদি স্প্যামার হন, দয়া করে এটি দেখুন এবং নিজের আচরণ পরিবর্তন বিবেচনা করুন।"

