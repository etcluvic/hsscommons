COM_USERS_USERCONSENT_MESSAGE="এই সিস্টেমের ব্যবহার নজরদারি, রেকর্ডকরণ এবং নিরীক্ষণের অধীন হতে পারে। অননুমোদিত ব্যবহার অপরাধ এবং দেওয়ানি শাস্তির যোগ্য। এই তথ্য ব্যবস্থার ব্যবহার নজরদারি এবং রেকর্ডকরণের জন্য সম্মতির ইঙ্গিত দেয়।"
