COM_MEMBERS_WHY_BECOME_MEMBER_EXPLANATION="একজন সদস্য হিসেবে, আপনি স্বয়ংক্রিয়ভাবে একটি কমিউনিটির অংশ হয়ে ওঠেন যা আপনার এবং আপনার সহকর্মীদের জন্য ডিজাইন করা হয়েছে। কমিউনিটির অংশ হওয়া আপনাকে বিশ্বব্যাপী সহকর্মী গবেষকদের সাথে জ্ঞান শেয়ার করতে দ্রুত এবং সহজ প্রবেশাধিকার প্রদান করে, যা আপনাকে আপনার লক্ষ্য অর্জনে সাহায্য করবে। সদস্যপদ ফ্রি, আজই শুরু করুন!"
