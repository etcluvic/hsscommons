; Groups Intro
COM_GROUPS_INTRO_WHAT_ARE_GROUPS_TITLE="গ্রুপ কি?"
COM_GROUPS_INTRO_WHAT_ARE_GROUPS_DESC="গ্রুপ হল ব্যক্তি প্ররযায়ে অথবা সবার সাথে কন্টেন্ট আদানপ্রদান এবং আলাপ-আলোচনা শেয়ার করার একটি সহজ উপায়। অনেক সময়, একটি নির্দিষ্ট বিষয়ের জন্য ইতিমধ্যে একটি গ্রুপ বিদ্যমান। আপনি যদি আপনার পছন্দের গ্রুপটি খুঁজে না পান, তাহলে আপনার নিজের গ্রুপ শুরু করুন।"
COM_GROUPS_INTRO_HOW_DO_GROUPS_WORK_TITLE="গ্রুপ কিভাবে কাজ করে?"
COM_GROUPS_INTRO_HOW_DO_GROUPS_WORK_DESC="গ্রুপ হতে পারে জনউন্মুক্ত, সীমিত (ব্যবহারকারীরা একটি সংক্ষিপ্ত বর্ণনা বা পর্যালোচনা পড়তে পারবেন, কিন্তু বিষয়বস্তু দেখতে পারবেন না।) অথবা সম্পূর্ণরূপে প্রাইভেট। প্রতিটি গ্রুপের একটি উইকি, রিসোর্সের জন্য একটি পুল, এবং আলোচনা করার জন্য একটি আলোচনা বোর্ড রয়েছে।"
