COM_CITATIONS_WHAT_ARE_CITATIONS="সাইটেশন কি?"
COM_CITATIONS_WHAT_ARE_CITATIONS_DESC="নিচে প্রদত্ত কাজগুলো এই সাইট বা সাইটের কোনো একটি অংশ উল্লেখ করেছে বা সাইট করেছে। প্রতিটি সাইটেশন সাইট করা বিষয়বস্তুর সাথে সংযুক্ত এবং BibTeX বা EndNote ফরম্যাটে ডাউনলোডযোগ্য।"
COM_CITATIONS_SUBMIT_CITATIONS="আমি কি সাইটেশন জমা দিতে পারি?"
COM_CITATIONS_SUBMIT_CITATIONS_DESC="হ্যাঁ! আপনি সাইটের বিষয়বস্তু উল্লেখ করা একটি কাজের জন্য উদ্ধৃতি জমা দিতে পারেন <a href="%s">এখানে ক্লিক করে</a>। তবে, অনুগ্রহ করে বিদ্যমান সাইটেশনগুলি খুঁজে দেখুন বা ব্রাউজ করুন যাতে কোনো এন্ট্রি ডুপ্লিকেট না হয়।"
COM_CITATIONS_SUBMIT_CITATIONS_DESC_NOTALLOWED="এই মুহূর্তে সাইটেশন জমা অনুমোদিত নয়। আপনার যদি কোনো প্রশ্ন থাকে, তবে অনুগ্রহ করে HSS Commons এর <a href=\"%s\">সাপোর্ট টিম</a> এর সাথে যোগাযোগ করুন।"
